schema: 1
name: web-security
version: "1.13.0"
description: >
  Web application penetration testing with 83 attack technique playbooks
  covering HTTP desync/request smuggling, cache poisoning, SSRF, SSTI, DOM
  vulnerabilities, authentication bypasses, parser differentials,
  AEM/Sling exploitation, GraphQL, OAuth, and client-side attacks.
  Includes geo-distributed DNS resolution via in-region open resolvers
  (Shodan/Censys) for detecting geo-fenced infrastructure,
  HTTP client tooling with OOB callbacks via webhook.site
  (API-key aware) and interactsh, four coexisting Caido surfaces
  (caido-cli server, the Python caido-sdk-client, lightweight and
  full-surface MCP servers, and the caido-mode TypeScript SDK CLI on
  @caido/sdk-client / caido-ts) for curl-through-Caido
  testing, match & replace rules, and replay handoffs; Burp proxy
  integration via MCP, browser automation via
  agent-browser, JS static analysis via jxscout, AST-based code pattern
  search via ast-grep, protobuf inspection via
  protoscope, credential management, DNS rebinding, HTTP desync
  fingerprinting with byte-exact smuggling payload construction, blind
  SQLi extraction, bug bounty scope lookup via bbscope, HackerOne program
  recon and report submission, SecurityContext vulnerability context
  from GitHub repos, issue tracking via Jira/GitHub/Linear, AWS
  exploitation with Pacu, phone verification, vulnerability
  verification, IP rotation helpers (Flareprox, fireprox), archive
  extraction vulnerability crafting with archivealchemist, EXIF
  metadata manipulation via exiftool, LSB steganography via stegano, and AgentMail email inboxes for
  agent-owned signup, recovery, and verification flows.

produces:
  values: [finding, asset]
  web_vulnerability: items:WebVulnerability
  web_endpoint: items:WebEndpoint

hooks:
  - hooks/interrupted_tool_result.py

mcp:
  servers:
    caido:
      command: "uv"
      args:
        - "run"
        - "${CAPABILITY_ROOT}/mcp/caido.py"
      init_timeout: 60
    caido-go:
      # Upstream Go MCP server (c0tton-fluff/caido-mcp-server), installed by
      # scripts/install_tools.sh. Exposes the full 60+ tool surface (batch
      # send, race-window, tamper rules, intercept, environments, websocket
      # streams) that the lightweight Python `caido` wrapper does not. Both
      # target the same Caido instance via CAIDO_URL. Auth resolves from
      # CAIDO_ACCESS_TOKEN (or the deprecated CAIDO_PAT alias), otherwise the
      # shared ~/.caido-mcp/token.json created by `caido-mcp-server login`.
      command: "caido-mcp-server"
      args:
        - "serve"
      env:
        CAIDO_URL: "${CAIDO_URL:-http://127.0.0.1:8080}"
        CAIDO_ACCESS_TOKEN: "${CAIDO_ACCESS_TOKEN:-}"
        CAIDO_ALLOW_SENSITIVE_HEADERS: "${CAIDO_ALLOW_SENSITIVE_HEADERS:-}"
      init_timeout: 60
    jxscout:
      command: "uv"
      args:
        - "run"
        - "${CAPABILITY_ROOT}/mcp/jxscout.py"
      init_timeout: 60
    thermoptic:
      command: "uv"
      args:
        - "run"
        - "${CAPABILITY_ROOT}/mcp/thermoptic.py"
      init_timeout: 60
    hackerone:
      command: "uv"
      args:
        - "run"
        - "${CAPABILITY_ROOT}/mcp/hackerone.py"
      init_timeout: 60
    jira:
      command: "uv"
      args:
        - "run"
        - "${CAPABILITY_ROOT}/mcp/jira.py"
      env:
        JIRA_BASE_URL: "${JIRA_BASE_URL:-}"
        JIRA_EMAIL: "${JIRA_EMAIL:-}"
        JIRA_API_TOKEN: "${JIRA_API_TOKEN:-}"
      init_timeout: 60
    github:
      command: "uv"
      args:
        - "run"
        - "${CAPABILITY_ROOT}/mcp/github.py"
      env:
        GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
        GITHUB_API_URL: "${GITHUB_API_URL:-https://api.github.com}"
      init_timeout: 60
    linear:
      command: "uv"
      args:
        - "run"
        - "${CAPABILITY_ROOT}/mcp/linear.py"
      env:
        LINEAR_API_KEY: "${LINEAR_API_KEY:-}"
        LINEAR_ACCESS_TOKEN: "${LINEAR_ACCESS_TOKEN:-}"
        LINEAR_API_URL: "${LINEAR_API_URL:-https://api.linear.app/graphql}"
      init_timeout: 60
    agent-browser:
      command: "uv"
      args:
        - "run"
        - "${CAPABILITY_ROOT}/mcp/agent_browser.py"
      init_timeout: 60
    protoscope:
      command: "uv"
      args:
        - "run"
        - "${CAPABILITY_ROOT}/mcp/protoscope.py"
      init_timeout: 60
    burp:
      url: "http://127.0.0.1:9876/"
      init_timeout: 15
      timeout: 3600
    securitycontext:
      command: "uv"
      args:
        - "run"
        - "${CAPABILITY_ROOT}/mcp/securitycontext.py"
      env:
        SECURITYCONTEXT_API_KEY: "${SECURITYCONTEXT_API_KEY:-}"
      init_timeout: 30

dependencies:
  packages:
    - default-jre-headless
  python:
    - "fastmcp>=2.0"
    - "httpx>=0.28"
    # >= 0.3.0: versioned GraphQL transport (transport/latest vs transport/v0_56).
    # Older releases break against Caido >= 0.57 replay schema. See mcp/caido.py.
    - "caido-sdk-client>=0.3.0"
    - "cryptography>=41.0"
    - "pydantic>=2.0"
    - "stegano>=0.11"
  scripts:
    - scripts/install_tools.sh

checks:
  - name: pd-tool-resolver
    command: test -x scripts/pd-tool
  - name: nuclei
    command: scripts/pd-tool nuclei -version >/dev/null 2>&1
  - name: httpx
    command: scripts/pd-tool httpx -version >/dev/null 2>&1
  - name: subfinder
    command: scripts/pd-tool subfinder -version >/dev/null 2>&1
  - name: naabu
    command: scripts/pd-tool naabu -version >/dev/null 2>&1
  - name: dnsx
    command: scripts/pd-tool dnsx -version >/dev/null 2>&1
  - name: katana
    command: scripts/pd-tool katana -version >/dev/null 2>&1
  - name: tlsx
    command: scripts/pd-tool tlsx -version >/dev/null 2>&1
  - name: alterx
    command: scripts/pd-tool alterx -version >/dev/null 2>&1
  - name: asnmap
    command: scripts/pd-tool asnmap -version >/dev/null 2>&1
  - name: uncover
    command: scripts/pd-tool uncover -version >/dev/null 2>&1
  - name: interactsh-client
    command: 'command -v interactsh-client >/dev/null 2>&1 || test -x "$HOME/go/bin/interactsh-client"'
  - name: protoscope
    command: 'command -v protoscope >/dev/null 2>&1 || test -x "$HOME/go/bin/protoscope"'
  - name: caido-cli
    command: command -v caido-cli
  - name: caido-mcp-server
    command: 'command -v caido-mcp-server >/dev/null 2>&1 || test -x "$HOME/bin/caido-mcp-server"'
  - name: caido-mode
    command: 'test -f skills/caido-mode/caido-client.ts && test -d skills/caido-mode/node_modules'
  - name: burp
    command: test -f /opt/burp/burpsuite.jar
  - name: waymore
    command: command -v waymore
  - name: pacu
    command: command -v pacu
  - name: fireprox
    command: 'test -f "$HOME/git/fireprox/fire.py"'
  - name: archivealchemist
    command: 'test -f "$HOME/git/archivealchemist/archive-alchemist.py"'
  - name: exiftool
    command: command -v exiftool
  - name: ast-grep
    command: command -v ast-grep
  - name: jxscout
    command: command -v jxscout-pro-v2

author:
  name: Dreadnode
  url: https://dreadnode.io
license: MIT
repository: https://github.com/dreadnode/capabilities
